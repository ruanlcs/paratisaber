<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e1b4b"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="badge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>

  <!-- fundo -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- selo TI -->
  <rect x="80" y="235" width="160" height="160" rx="36" fill="url(#badge)"/>
  <text x="160" y="320" text-anchor="middle" dominant-baseline="central"
        font-family="'Segoe UI', Arial, sans-serif" font-size="80"
        font-weight="700" fill="#ffffff" letter-spacing="2">TI</text>

  <!-- titulo -->
  <text x="290" y="285" font-family="'Segoe UI', Arial, sans-serif"
        font-size="76" font-weight="700" fill="#ffffff">ParaTISaber</text>

  <!-- subtitulo -->
  <text x="292" y="350" font-family="'Segoe UI', Arial, sans-serif"
        font-size="34" font-weight="400" fill="#c7d2fe">Estudos de TI e Informática,</text>
  <text x="292" y="398" font-family="'Segoe UI', Arial, sans-serif"
        font-size="34" font-weight="400" fill="#c7d2fe">abertos e gratuitos, em português.</text>

  <!-- rodape -->
  <text x="80" y="560" font-family="'Segoe UI', Arial, sans-serif"
        font-size="28" font-weight="400" fill="#64748b">paratisaber.com.br</text>
</svg>
